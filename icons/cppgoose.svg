<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" />

  <!-- Goose Shadow -->
  <ellipse cx="64" cy="106" rx="36" ry="7" fill="#0369a1" opacity="0.4"/>

  <!-- Goose Legs & Feet -->
  <path d="M 52 86 L 48 104 M 48 104 L 40 106 M 48 104 L 54 106" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 72 86 L 76 104 M 76 104 L 70 106 M 76 104 L 84 105" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Goose Body & Tail -->
  <path d="M 44 68 C 30 72 26 84 38 90 C 48 94 82 94 92 82 C 98 74 94 66 84 66 C 74 66 60 66 52 64 Z" fill="#f1f5f9" filter="url(#shadow)"/>
  
  <!-- Goose Wing -->
  <path d="M 50 72 C 58 68 76 68 84 76 C 78 84 62 85 48 76 Z" fill="#e2e8f0"/>

  <!-- Goose Neck & Head -->
  <path d="M 78 72 C 78 55 76 40 78 30 C 80 22 72 18 64 20 C 56 22 52 30 56 40 C 60 48 64 62 66 72 Z" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Beak -->
  <path d="M 54 27 L 34 32 C 32 33 32 36 35 37 L 54 39 Z" fill="#ea580c"/>
  <path d="M 34 32 L 54 35" stroke="#c2410c" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="60" cy="27" r="3" fill="#0f172a"/>
  <circle cx="59" cy="26" r="1" fill="#ffffff"/>

  <!-- Honk exclamation / playful notes -->
  <path d="M 28 20 Q 25 15 28 10" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 22 26 Q 16 22 18 16" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
